<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read and Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="scene-viewport">
    <main id="scene">
      <!-- The map fills the wide scene, while the interaction layer stays viewport-sized. -->
      <img id="landing-background" src="images/Background placeholder.png" alt="">
      <div id="map-letters" role="group" aria-label="Letters placed on the map">
        <a class="map-letter-link" href="letter.html" aria-label="Open letter A">
          <img src="images/Letter map A.png" alt="">
        </a>
        <a class="map-letter-link" href="letter.html" aria-label="Open letter B">
          <img src="images/Letter map B.png" alt="">
        </a>
        <a class="map-letter-link" href="letter.html" aria-label="Open letter C">
          <img src="images/Letter map C.png" alt="">
        </a>
        <a class="map-letter-link" href="letter.html" aria-label="Open letter D">
          <img src="images/Letter map D.png" alt="">
        </a>
      </div>
      <div id="interactive-area">
        <img id="pbox" src="images/New Pbox rest.png" alt="Pbox character resting">
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
